<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff87" />
      <stop offset="50%" stop-color="#00e676" />
      <stop offset="100%" stop-color="#00b0ff" />
    </linearGradient>
    <radialGradient id="neonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0" />
    </radialGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Cyberpunk Background Circle -->
  <rect width="512" height="512" rx="128" fill="#080c14" />
  <circle cx="256" cy="256" r="230" fill="url(#neonGlow)" />
  
  <!-- Outer Neon Circuit Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#cyberGreen)" stroke-width="8" stroke-dasharray="24 12" opacity="0.6" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#00e676" stroke-width="4" opacity="0.3" />

  <!-- Glowing Digital Shield / Core Glyph -->
  <g filter="url(#glowEffect)">
    <!-- Prosperity Code Diamond / Matrix Symbol -->
    <path d="M 256 90 L 390 190 L 390 330 L 256 425 L 122 330 L 122 190 Z" 
          fill="none" stroke="url(#cyberGreen)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" />
    
    <!-- Inner Glowing Code Bolt / Prosperity Monogram -->
    <path d="M 280 145 L 175 270 L 250 270 L 232 367 L 337 242 L 262 242 Z" 
          fill="url(#cyberGreen)" />
  </g>

  <!-- Digital Tech Accent Dots -->
  <circle cx="256" cy="90" r="10" fill="#00ff87" />
  <circle cx="390" cy="190" r="10" fill="#00e676" />
  <circle cx="390" cy="330" r="10" fill="#00b0ff" />
  <circle cx="256" cy="425" r="10" fill="#00ff87" />
  <circle cx="122" cy="330" r="10" fill="#00b0ff" />
  <circle cx="122" cy="190" r="10" fill="#00e676" />
</svg>
